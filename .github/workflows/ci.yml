name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "plan/**"
  pull_request:

# A newer push to the same PR or branch replaces the run still in progress;
# runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# One job installs dependencies once and runs every check, which keeps billed
# Actions minutes inside the free allowance. Each check runs even when an
# earlier one failed, so a lint failure no longer hides test or build results;
# `quality-gate` passes only when every check passed.
jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - name: Install dependencies
        id: install
        run: bun install --frozen-lockfile
      - name: Typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bunx tsc --noEmit
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test
      - name: Build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      # Fails on high or critical advisories in production dependencies; dev tooling is reported as warnings.
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: bun scripts/dependency-audit.ts
