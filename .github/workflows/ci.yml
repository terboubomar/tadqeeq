name: CI

on:
  push:
    branches:
      - main
      - "fix/**"
      - "plan/**"
  pull_request:

# Each check runs as its own job so a lint failure no longer hides test or
# build results. `quality-gate` is the single required status: it passes only
# when every check passed.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build

  quality-gate:
    if: always()
    needs: [typecheck, lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "typecheck=${{ needs.typecheck.result }} lint=${{ needs.lint.result }} test=${{ needs.test.result }} build=${{ needs.build.result }}"
          test "${{ needs.typecheck.result }}" = "success"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.build.result }}" = "success"
